<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Modo Rápido — Registro de pedidos</title>
<style>
  :root{
    --paper:#F4F3EF;
    --surface:#FFFFFF;
    --ink:#15171A;
    --ink-soft:#5C6168;
    --line:#DEDCD5;
    --go:#0B6E4F;
    --go-dark:#095B41;
    --wait:#B26A12;
    --wait-bg:#FDF4E6;
    --radius:10px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto}
  .brand span{display:block;font-weight:400;font-size:12px;color:var(--ink-soft);letter-spacing:0}
  select.rubro{
    font-size:13px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:var(--surface);color:var(--ink-soft);
  }
  .ghost{
    font-size:13px;padding:8px 12px;border:1px solid var(--line);
    border-radius:8px;color:var(--ink-soft);white-space:nowrap;
  }
  .ghost:hover{background:var(--paper)}
  .ghost b{color:var(--ink)}

  /* ---------- tabs (mobile) ---------- */
  .tabs{
    flex:0 0 auto;display:flex;gap:6px;padding:10px 16px 0;
  }
  .tabs button{
    flex:1;padding:11px 8px;border-radius:8px;font-size:14px;font-weight:600;
    color:var(--ink-soft);background:transparent;border:1px solid transparent;
  }
  .tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}

  /* ---------- layout ---------- */
  main{flex:1 1 auto;min-height:0;display:flex;gap:14px;padding:14px 16px 16px}
  .pane{min-height:0;display:flex;flex-direction:column}
  .pane-new{flex:3 1 0}
  .pane-active{flex:2 1 0}
  .pane-title{
    flex:0 0 auto;font-size:13px;font-weight:600;color:var(--ink-soft);
    margin:0 0 9px;display:flex;align-items:baseline;gap:7px;
  }
  .pane-title .count{
    font-size:12px;font-weight:700;color:var(--wait);
    background:var(--wait-bg);padding:2px 7px;border-radius:20px;
  }

  /* ---------- product grid ---------- */
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding-bottom:4px}
  .prod{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:13px 11px;min-height:66px;
    display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:left;
    transition:transform .07s ease, border-color .12s ease;
  }
  .prod:active{transform:scale(.96)}
  .prod:hover{border-color:#C9C6BC}
  .prod .n{font-weight:600;font-size:14px;line-height:1.25}
  .prod .p{font-size:12px;color:var(--ink-soft)}
  .prod .qty{
    position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;
    border-radius:12px;background:var(--go);color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 6px;
  }
  .prod.on{border-color:var(--go);box-shadow:inset 0 0 0 1px var(--go)}

  /* ---------- draft ---------- */
  .draft{
    flex:0 0 auto;margin-top:11px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);
  }
  .draft-empty{padding:13px;font-size:13px;color:var(--ink-soft);text-align:center}
  .draft-list{max-height:132px;overflow-y:auto;padding:5px 5px 0}
  .dline{display:flex;align-items:center;gap:9px;padding:5px 8px}
  .dline .name{flex:1;font-size:14px}
  .dline .step{
    width:30px;height:30px;border-radius:7px;border:1px solid var(--line);
    font-size:17px;line-height:1;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
  }
  .dline .step:hover{background:var(--paper);color:var(--ink)}
  .dline .q{min-width:20px;text-align:center;font-weight:700;font-size:15px}
  .note-row{padding:5px 13px 0}
  .note-toggle{font-size:13px;color:var(--go);font-weight:600;padding:5px 0}
  .note-row input{
    width:100%;font-size:14px;padding:9px 10px;margin:4px 0 2px;
    border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);
  }
  .note-row input:focus{outline:2px solid var(--go);outline-offset:0;background:var(--surface)}
  .confirm{
    width:100%;margin:9px 0 0;padding:16px;background:var(--go);color:#fff;
    border-radius:0 0 var(--radius) var(--radius);font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .confirm:hover{background:var(--go-dark)}
  .confirm:disabled{background:#CFCEC8;color:#8A8880;cursor:default}
  .confirm .tot{font-weight:600;opacity:.85}

  /* ---------- active orders ---------- */
  .orders{display:flex;flex-direction:column;gap:9px}
  .order{
    background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--wait);
    border-radius:var(--radius);padding:11px 13px;
  }
  .order.new{animation:pop .35s ease}
  @keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
  .order-head{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
  .order-num{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .order-time{font-size:12px;color:var(--wait);font-weight:600;margin-left:auto}
  .order-items{font-size:14px;line-height:1.45}
  .order-note{
    font-size:13px;color:var(--ink-soft);margin-top:4px;
    padding-left:9px;border-left:2px solid var(--line);
  }
  .deliver{
    width:100%;margin-top:10px;padding:11px;border:1px solid var(--go);
    border-radius:8px;color:var(--go);font-weight:700;font-size:14px;
  }
  .deliver:hover{background:var(--go);color:#fff}
  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);
    padding:26px 18px;text-align:center;color:var(--ink-soft);font-size:14px;
  }

  /* ---------- history panel ---------- */
  .scrim{position:fixed;inset:0;background:rgba(21,23,26,.4);z-index:20;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .panel{
    position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:21;
    background:var(--paper);border-left:1px solid var(--line);
    display:flex;flex-direction:column;animation:slide .2s ease;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @keyframes slide{from{transform:translateX(22px);opacity:.4}to{transform:none;opacity:1}}
  .panel header{border-bottom:1px solid var(--line)}
  .stats{
    flex:0 0 auto;display:flex;gap:10px;padding:14px 16px;
  }
  .stat{
    flex:1;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 13px;
  }
  .stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .hist{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
  .hrow{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 13px;display:flex;gap:11px;align-items:baseline;
  }
  .hrow .hn{font-weight:700;font-size:15px;min-width:34px}
  .hrow .hi{flex:1;font-size:13px;line-height:1.45}
  .hrow .hi small{display:block;color:var(--ink-soft)}
  .hrow .ht{font-size:12px;color:var(--ink-soft);white-space:nowrap}

  /* ---------- responsive ---------- */
  .tabs{display:none}
  @media (max-width:860px){
    .tabs{display:flex}
    main{padding-top:10px}
    .pane{display:none;flex:1 1 auto}
    .pane.show{display:flex}
    .brand span{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="brand" id="brandName">Café del Centro<span>Modo rápido</span></div>
  <select class="rubro" id="rubro" aria-label="Tipo de negocio">
    <option value="cafeteria">Cafetería</option>
    <option value="rotiseria">Rotisería</option>
    <option value="kiosco">Kiosco</option>
  </select>
  <button class="ghost" id="btnHist">Historial <b class="num" id="histCount">0</b></button>
  <button class="ghost" id="btnReset" title="Reiniciar demo">Reiniciar</button>
</header>

<div class="tabs" role="tablist">
  <button id="tabNew" role="tab" aria-selected="true">Nuevo pedido</button>
  <button id="tabActive" role="tab" aria-selected="false">Activos <span class="num" id="tabCount">0</span></button>
</div>

<main>
  <section class="pane pane-new show" id="paneNew">
    <h2 class="pane-title">Tocá los productos</h2>
    <div class="scroll"><div class="grid" id="grid"></div></div>
    <div class="draft" id="draft"></div>
  </section>

  <section class="pane pane-active" id="paneActive">
    <h2 class="pane-title">En el mostrador <span class="count num" id="activeCount">0</span></h2>
    <div class="scroll"><div class="orders" id="orders"></div></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  var RUBROS = {
    cafeteria: {
      nombre:"Café del Centro",
      productos:[
        {n:"Café",p:1200},{n:"Café con leche",p:1600},{n:"Cortado",p:1300},
        {n:"Submarino",p:2200},{n:"Medialuna",p:700},{n:"Tostado",p:3800},
        {n:"Budín",p:1500},{n:"Exprimido",p:2400},{n:"Agua",p:1000},{n:"Gaseosa",p:1800}
      ],
      iniciales:[
        {items:[["Café",2],["Medialuna",3]],nota:"",min:4},
        {items:[["Tostado",1],["Exprimido",1]],nota:"sin manteca",min:9}
      ]
    },
    rotiseria: {
      nombre:"Rotisería La Esquina",
      productos:[
        {n:"Milanesa",p:5500},{n:"Mila napolitana",p:6800},{n:"Pollo al horno",p:7200},
        {n:"Papas fritas",p:3500},{n:"Ensalada rusa",p:3000},{n:"Empanada",p:1400},
        {n:"Tarta",p:4200},{n:"Canelones",p:6000},{n:"Gaseosa 1.5",p:3200}
      ],
      iniciales:[
        {items:[["Milanesa",2],["Papas fritas",1]],nota:"para llevar",min:6},
        {items:[["Empanada",6]],nota:"3 carne 3 jyq",min:12},
        {items:[["Pollo al horno",1]],nota:"",min:2}
      ]
    },
    kiosco: {
      nombre:"Kiosco 24hs",
      productos:[
        {n:"Alfajor",p:1300},{n:"Chicles",p:800},{n:"Gaseosa",p:2000},
        {n:"Agua",p:1200},{n:"Papas",p:2500},{n:"Cigarrillos",p:4500},
        {n:"Chocolate",p:1800},{n:"Energizante",p:3000},{n:"Caramelos",p:600},{n:"Galletitas",p:2200}
      ],
      iniciales:[
        {items:[["Gaseosa",1],["Papas",2]],nota:"",min:1}
      ]
    }
  };

  var rubroKey="cafeteria", productos=[], activos=[], historial=[], draft={}, nota="", notaOpen=false, contador=1, vistaMobile="new";

  var $=function(id){return document.getElementById(id)};
  var money=function(n){return "$"+n.toLocaleString("es-AR")};

  function ahora(){return Date.now()}
  function hace(ts){
    var m=Math.floor((ahora()-ts)/60000);
    if(m<1) return "recién";
    if(m===1) return "hace 1 min";
    if(m<60) return "hace "+m+" min";
    var h=Math.floor(m/60);
    return "hace "+h+" h";
  }
  function hora(ts){
    var d=new Date(ts);
    return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  }
  function resumen(items){
    return items.map(function(i){return i.q+" "+i.n}).join(", ");
  }
  function totalDe(items){
    return items.reduce(function(a,i){return a+i.q*i.p},0);
  }

  // ---------- cargar rubro ----------
  function cargarRubro(k){
    rubroKey=k;
    var r=RUBROS[k];
    productos=r.productos;
    draft={}; nota=""; notaOpen=false;
    activos=[]; historial=[]; contador=1;
    $("brandName").childNodes[0].nodeValue=r.nombre;
    r.iniciales.forEach(function(o){
      var items=o.items.map(function(pair){
        var prod=productos.filter(function(p){return p.n===pair[0]})[0];
        return {n:pair[0],q:pair[1],p:prod?prod.p:0};
      });
      activos.push({id:contador++,items:items,nota:o.nota,ts:ahora()-o.min*60000,fresh:false});
    });
    render();
  }

  // ---------- productos ----------
  function tocarProducto(nombre){
    draft[nombre]=(draft[nombre]||0)+1;
    renderGrid(); renderDraft();
  }
  function ajustar(nombre,delta){
    draft[nombre]=(draft[nombre]||0)+delta;
    if(draft[nombre]<=0) delete draft[nombre];
    renderGrid(); renderDraft();
  }
  function draftItems(){
    return Object.keys(draft).map(function(n){
      var prod=productos.filter(function(p){return p.n===n})[0];
      return {n:n,q:draft[n],p:prod?prod.p:0};
    });
  }

  // ---------- pedidos ----------
  function registrar(){
    var items=draftItems();
    if(!items.length) return;
    activos.unshift({id:contador++,items:items,nota:nota.trim(),ts:ahora(),fresh:true});
    draft={}; nota=""; notaOpen=false;
    render();
    setTimeout(function(){
      activos.forEach(function(o){o.fresh=false});
    },400);
    if(window.innerWidth<=860){ setVista("active"); }
  }
  function entregar(id){
    for(var i=0;i<activos.length;i++){
      if(activos[i].id===id){
        var o=activos.splice(i,1)[0];
        o.entregado=ahora();
        historial.unshift(o);
        break;
      }
    }
    render();
  }

  // ---------- render ----------
  function renderGrid(){
    var g=$("grid"); g.innerHTML="";
    productos.forEach(function(p){
      var b=document.createElement("button");
      b.className="prod"+(draft[p.n]?" on":"");
      b.innerHTML='<span class="n"></span><span class="p num"></span>'+
        (draft[p.n]?'<span class="qty num">'+draft[p.n]+'</span>':'');
      b.querySelector(".n").textContent=p.n;
      b.querySelector(".p").textContent=money(p.p);
      b.addEventListener("click",function(){tocarProducto(p.n)});
      g.appendChild(b);
    });
  }

  function renderDraft(){
    var d=$("draft"), items=draftItems();
    if(!items.length){
      d.innerHTML='<div class="draft-empty">El pedido se arma acá</div>';
      return;
    }
    var html='<div class="draft-list">';
    items.forEach(function(i){
      html+='<div class="dline" data-n="'+i.n.replace(/"/g,'&quot;')+'">'+
        '<span class="name"></span>'+
        '<button class="step" data-d="-1" aria-label="Quitar uno">−</button>'+
        '<span class="q num">'+i.q+'</span>'+
        '<button class="step" data-d="1" aria-label="Agregar uno">+</button>'+
      '</div>';
    });
    html+='</div><div class="note-row">';
    html+= notaOpen
      ? '<input id="notaInput" placeholder="Ej: sin sal, para llevar" maxlength="60">'
      : '<button class="note-toggle" id="notaBtn">+ nota</button>';
    html+='</div>';
    html+='<button class="confirm" id="btnConfirm">Registrar pedido <span class="tot num">'+money(totalDe(items))+'</span></button>';
    d.innerHTML=html;

    var lines=d.querySelectorAll(".dline");
    for(var k=0;k<lines.length;k++){
      (function(line){
        line.querySelector(".name").textContent=line.getAttribute("data-n");
        var btns=line.querySelectorAll(".step");
        for(var j=0;j<btns.length;j++){
          (function(btn){
            btn.addEventListener("click",function(){
              ajustar(line.getAttribute("data-n"),parseInt(btn.getAttribute("data-d"),10));
            });
          })(btns[j]);
        }
      })(lines[k]);
    }
    var nb=$("notaBtn");
    if(nb) nb.addEventListener("click",function(){notaOpen=true;renderDraft();var el=$("notaInput");if(el)el.focus()});
    var ni=$("notaInput");
    if(ni){ ni.value=nota; ni.addEventListener("input",function(){nota=ni.value}); }
    $("btnConfirm").addEventListener("click",registrar);
  }

  function renderOrders(){
    var c=$("orders");
    $("activeCount").textContent=activos.length;
    $("tabCount").textContent=activos.length;
    if(!activos.length){
      c.innerHTML='<div class="empty">No hay pedidos en curso.<br>Los que registres aparecen acá hasta que los entregues.</div>';
      return;
    }
    c.innerHTML="";
    activos.forEach(function(o){
      var el=document.createElement("article");
      el.className="order"+(o.fresh?" new":"");
      var h='<div class="order-head"><span class="order-num num">#'+o.id+'</span>'+
            '<span class="order-time num">'+hace(o.ts)+'</span></div>'+
            '<div class="order-items"></div>';
      if(o.nota) h+='<div class="order-note"></div>';
      h+='<button class="deliver">Entregado</button>';
      el.innerHTML=h;
      el.querySelector(".order-items").textContent=resumen(o.items);
      if(o.nota) el.querySelector(".order-note").textContent=o.nota;
      el.querySelector(".deliver").addEventListener("click",function(){entregar(o.id)});
      c.appendChild(el);
    });
  }

  function render(){
    renderGrid(); renderDraft(); renderOrders();
    $("histCount").textContent=historial.length;
  }

  // ---------- historial ----------
  function abrirHistorial(){
    var scrim=document.createElement("div");
    scrim.className="scrim";
    var panel=document.createElement("aside");
    panel.className="panel";

    var vendido=historial.reduce(function(a,o){return a+totalDe(o.items)},0);
    var html='<header><div class="brand">Historial<span>Pedidos entregados</span></div>'+
             '<button class="ghost" id="closeHist">Cerrar</button></header>'+
             '<div class="stats">'+
               '<div class="stat"><div class="v num">'+historial.length+'</div><div class="l">pedidos entregados</div></div>'+
               '<div class="stat"><div class="v num">'+money(vendido)+'</div><div class="l">total del día</div></div>'+
             '</div><div class="hist" id="histList"></div>';
    panel.innerHTML=html;

    var list=panel.querySelector("#histList");
    if(!historial.length){
      list.innerHTML='<div class="empty">Todavía no entregaste ningún pedido.<br>Cuando marques uno como entregado, queda registrado acá.</div>';
    }else{
      historial.forEach(function(o){
        var row=document.createElement("div");
        row.className="hrow";
        row.innerHTML='<span class="hn num">#'+o.id+'</span>'+
                      '<span class="hi"></span>'+
                      '<span class="ht num">'+hora(o.entregado)+' · '+money(totalDe(o.items))+'</span>';
        var hi=row.querySelector(".hi");
        hi.textContent=resumen(o.items);
        if(o.nota){
          var s=document.createElement("small");
          s.textContent=o.nota;
          hi.appendChild(s);
        }
        list.appendChild(row);
      });
    }

    function cerrar(){
      if(scrim.parentNode) document.body.removeChild(scrim);
      if(panel.parentNode) document.body.removeChild(panel);
      document.removeEventListener("keydown",onKey);
    }
    function onKey(e){ if(e.key==="Escape") cerrar(); }

    document.body.appendChild(scrim);
    document.body.appendChild(panel);
    scrim.addEventListener("click",cerrar);
    panel.querySelector("#closeHist").addEventListener("click",cerrar);
    document.addEventListener("keydown",onKey);
  }

  // ---------- vista mobile ----------
  function setVista(v){
    vistaMobile=v;
    $("paneNew").classList.toggle("show",v==="new");
    $("paneActive").classList.toggle("show",v==="active");
    $("tabNew").setAttribute("aria-selected",v==="new");
    $("tabActive").setAttribute("aria-selected",v==="active");
  }

  // ---------- eventos ----------
  $("tabNew").addEventListener("click",function(){setVista("new")});
  $("tabActive").addEventListener("click",function(){setVista("active")});
  $("btnHist").addEventListener("click",abrirHistorial);
  $("btnReset").addEventListener("click",function(){cargarRubro(rubroKey);setVista("new")});
  $("rubro").addEventListener("change",function(e){cargarRubro(e.target.value);setVista("new")});

  setInterval(renderOrders,20000);

  cargarRubro("cafeteria");
  setVista("new");
})();
</script>
</body>
</html>
